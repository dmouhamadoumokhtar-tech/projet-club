<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="moleculePattern" patternUnits="userSpaceOnUse" width="200" height="200" patternTransform="scale(0.75) rotate(0)">
      <!-- Atom 1 -->
      <circle cx="100" cy="100" r="12" fill="#fff" opacity="0.6"/>
      
      <!-- Connection lines -->
      <line x1="100" y1="100" x2="160" y2="70" stroke="#fff" stroke-width="3" opacity="0.4"/>
      <line x1="100" y1="100" x2="40" y2="70" stroke="#fff" stroke-width="3" opacity="0.4"/>
      <line x1="100" y1="100" x2="100" y2="30" stroke="#fff" stroke-width="3" opacity="0.4"/>
      <line x1="100" y1="100" x2="100" y2="170" stroke="#fff" stroke-width="3" opacity="0.4"/>
      
      <!-- Surrounding atoms -->
      <circle cx="160" cy="70" r="8" fill="#fff" opacity="0.5"/>
      <circle cx="40" cy="70" r="8" fill="#fff" opacity="0.5"/>
      <circle cx="100" cy="30" r="8" fill="#fff" opacity="0.5"/>
      <circle cx="100" cy="170" r="8" fill="#fff" opacity="0.5"/>
      
      <!-- Additional molecular structure -->
      <circle cx="20" cy="180" r="10" fill="#fff" opacity="0.4"/>
      <circle cx="180" cy="20" r="10" fill="#fff" opacity="0.4"/>
      <line x1="40" y1="70" x2="20" y2="180" stroke="#fff" stroke-width="2" opacity="0.3"/>
      <line x1="160" y1="70" x2="180" y2="20" stroke="#fff" stroke-width="2" opacity="0.3"/>
      
      <!-- Electron orbit suggestion -->
      <ellipse cx="100" cy="100" rx="35" ry="18" fill="none" stroke="#fff" stroke-width="1" opacity="0.2" transform="rotate(30, 100, 100)"/>
      <ellipse cx="100" cy="100" rx="35" ry="20" fill="none" stroke="#fff" stroke-width="1" opacity="0.2" transform="rotate(120, 100, 100)"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#moleculePattern)"/>
</svg>
